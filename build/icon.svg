<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262638"/>
      <stop offset="55%" stop-color="#15151f"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4abfa"/>
      <stop offset="100%" stop-color="#7c5cbf"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cbf" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c5cbf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded-square dark base -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="5" y="5" width="502" height="502" rx="112" fill="none" stroke="#a888f0" stroke-opacity="0.18" stroke-width="3"/>

  <!-- accent glow behind the waveform -->
  <circle cx="256" cy="268" r="205" fill="url(#glow)"/>

  <!-- symmetric Bard waveform -->
  <g fill="url(#wave)">
    <rect x="69"  y="181" width="46" height="150" rx="23" opacity="0.8"/>
    <rect x="151" y="131" width="46" height="250" rx="23" opacity="0.92"/>
    <rect x="233" y="86"  width="46" height="340" rx="23"/>
    <rect x="315" y="131" width="46" height="250" rx="23" opacity="0.92"/>
    <rect x="397" y="181" width="46" height="150" rx="23" opacity="0.8"/>
  </g>

  <!-- moment sparkle, top right -->
  <path d="M 402 96 q 7 26 33 33 q -26 7 -33 33 q -7 -26 -33 -33 q 26 -7 33 -33 Z" fill="#cdb9f8"/>
</svg>
