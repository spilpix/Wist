<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="72%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1C1450"/>
      <stop offset="55%" stop-color="#0D0B30"/>
      <stop offset="100%" stop-color="#050512"/>
    </radialGradient>
    <linearGradient id="lt" x1="130" y1="96" x2="130" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="42%" stop-color="#DCE5FF"/>
      <stop offset="100%" stop-color="#7F9AFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-25%" width="160%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feFlood flood-color="#4455EE" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="tinted"/>
      <feMerge>
        <feMergeNode in="tinted"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Ambient glow behind letter -->
  <ellipse cx="248" cy="256" rx="162" ry="152" fill="#2820A8" opacity="0.28"/>

  <!-- B letterform: fill-rule evenodd cuts the counter holes -->
  <path
    fill="url(#lt)"
    fill-rule="evenodd"
    filter="url(#glow)"
    d="M 130 96 L 260 96 A 79 81 0 0 1 260 258 A 83 79 0 0 1 260 416 L 130 416 Z M 186 156 A 75 35 0 0 1 186 226 Z M 186 316 A 79 33 0 0 1 186 382 Z"
  />
</svg>
