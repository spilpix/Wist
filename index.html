<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bard</title>
    <script>
      // apply the last resolved theme before first paint — no flash on startup
      try {
        var t = localStorage.getItem('wist.themeResolved')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <style>
      html { background: #faf9f5; }
      html[data-theme='dark'] { background: #1e1a17; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
